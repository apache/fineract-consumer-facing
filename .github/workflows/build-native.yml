name: Consumer App Native Image

on:
  push:
    paths:
      - 'consumer/**'
      - '.github/workflows/build-native.yml'
  pull_request:
    paths:
      - 'consumer/**'
      - '.github/workflows/build-native.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: consumer

jobs:
  native:
    name: Native image build and Cucumber
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - name: Setup Gradle and Validate Wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Generate dev JWT signing key
        run: ./scripts/generate-dev-jwt-key.sh

      - name: Pre-create JaCoCo mount directories
        run: mkdir -p build/jacoco-agent build/jacoco

      # Compile before starting the stack: native-image peaks around 10 GiB and Fineract alone takes 2 GiB.
      # The runner has 16 GiB. Generating the Fineract client needs the -Xmx12g in gradle.properties, and a
      # Gradle process keeps the heap it has grown into. Run with the native-image builder beside it, the two
      # exhausted the runner in the image's layout stage, which GitHub reports only as "The operation was
      # canceled". So generate, compile and AOT-process in one Gradle process, which exits and frees its heap,
      # then build the image from a second one that only finds those tasks (everything nativeCompile depends
      # on) up to date. The builder peaks at about 8.3 GiB; capping it makes a shortfall fail inside the
      # build, with a message.
      - name: Generate, compile and AOT-process
        run: ./gradlew --no-daemon -Pnative aotClasses jar generateResourcesConfigFile

      - name: Compile native image
        env:
          NATIVE_IMAGE_OPTIONS: -J-Xmx9g
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g -Pnative nativeCompile

      - name: Start application stack with the native BFF
        run: docker compose -f compose.yaml -f compose.native.yaml up -d --build --wait --wait-timeout 300

      - name: Capture OpenAPI spec and generate the test client
        run: ./gradlew --no-daemon openapi generateJavaClient

      - name: Run Cucumber tests against the native BFF
        run: ./gradlew --no-daemon cucumber

      - name: Record native footprint
        if: success()
        run: |
          {
            echo "### Native BFF"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Binary size | $(du -h build/native/nativeCompile/consumer | cut -f1) |"
            echo "| Startup | $(docker compose logs bff | grep -o 'Started ConsumerApplication in [0-9.]* seconds' | tail -1 | grep -o '[0-9.]* seconds') |"
            echo "| Memory after the Cucumber suite | $(docker stats --no-stream --format '{{.MemUsage}}' bff) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.native.yaml logs --no-color

      - name: Tear down application stack
        if: always()
        run: docker compose -f compose.yaml -f compose.native.yaml down -v

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-test-results
          path: 'consumer/**/build/reports/'
          retention-days: 5
