# Real end-to-end journeys across the whole stack: the built Angular app (nginx), the BFF, Fineract,
# both PostgreSQL databases, Valkey and Mailpit, from docker-compose.e2e.yml. Nothing is mocked; see
# docs/frontend/development/build-and-test.adoc ("Full-stack journeys").
#
# Stack combinations:
#   pull requests and main  Fineract pinned in consumer/compose.yaml, BFF on the JVM
#   nightly                 additionally Fineract `develop` (does upstream still work with us?)
#                           and the BFF as the GraalVM native image
#   manual dispatch         any one combination
name: Full-Stack E2E

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'consumer/**'
      - 'docker-compose.e2e.yml'
      - 'docker-compose.e2e.native.yml'
      - '.github/workflows/e2e-full-stack.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'consumer/**'
      - 'docker-compose.e2e.yml'
      - 'docker-compose.e2e.native.yml'
      - '.github/workflows/e2e-full-stack.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fineract:
        description: 'Fineract image: "pinned" (consumer/compose.yaml) or an apache/fineract tag such as "develop"'
        default: pinned
        type: string
      bff:
        description: BFF runtime
        default: jvm
        type: choice
        options: [jvm, native]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Choose stack combinations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build the matrix
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FINERACT: ${{ inputs.fineract }}
          INPUT_BFF: ${{ inputs.bff }}
        run: |
          case "$EVENT" in
            schedule)
              matrix='[{"fineract":"pinned","bff":"jvm"},{"fineract":"develop","bff":"jvm"},{"fineract":"pinned","bff":"native"}]' ;;
            workflow_dispatch)
              if ! [[ "$INPUT_FINERACT" =~ ^[A-Za-z0-9._-]+$ ]]; then
                echo "::error::Invalid Fineract image tag: $INPUT_FINERACT"; exit 1
              fi
              matrix=$(jq -cn --arg f "$INPUT_FINERACT" --arg b "$INPUT_BFF" '[{fineract:$f,bff:$b}]') ;;
            *)
              matrix='[{"fineract":"pinned","bff":"jvm"}]' ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  journeys:
    name: Journeys (Fineract ${{ matrix.fineract }}, BFF ${{ matrix.bff }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Empty selects the tag pinned in consumer/compose.yaml.
      FINERACT_IMAGE_TAG: ${{ matrix.fineract != 'pinned' && matrix.fineract || '' }}
      COMPOSE_FILES: ${{ matrix.bff == 'native' && '-f docker-compose.e2e.yml -f docker-compose.e2e.native.yml' || '-f docker-compose.e2e.yml' }}
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 25
        if: matrix.bff == 'jvm'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Set up GraalVM 25
        if: matrix.bff == 'native'
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - name: Setup Gradle and Validate Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Read Playwright version
        id: pw-version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Generate dev JWT signing key
        working-directory: consumer
        run: ./scripts/generate-dev-jwt-key.sh

      - name: Pre-create JaCoCo mount directories
        run: mkdir -p consumer/build/jacoco-agent consumer/build/jacoco

      # Same split as build-native.yml: native-image peaks around 8 GiB, and a Gradle process keeps the
      # heap it grew into, so generation and AOT run in one process and the image is built in another.
      - name: Generate, compile and AOT-process (native)
        if: matrix.bff == 'native'
        working-directory: consumer
        run: ./gradlew --no-daemon -Pnative aotClasses jar generateResourcesConfigFile

      - name: Compile native image (native)
        if: matrix.bff == 'native'
        working-directory: consumer
        env:
          NATIVE_IMAGE_OPTIONS: -J-Xmx9g
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g -Pnative nativeCompile

      - name: Start the backend
        run: docker compose $COMPOSE_FILES up -d --build --wait --wait-timeout 600 bff

      # The frontend image builds the app against the TypeScript client generated from the running BFF.
      - name: Generate the BFF client
        working-directory: frontend
        run: npm run generate:client

      - name: Start the frontend
        run: docker compose $COMPOSE_FILES up -d --build --wait --wait-timeout 300

      - name: Record the stack under test
        run: |
          {
            echo "### Stack under test"
            echo ""
            echo "| Service | Image |"
            echo "|---|---|"
            docker compose $COMPOSE_FILES ps --format '| {{.Service}} | {{.Image}} |'
            echo ""
            echo "Fineract build: $(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$(docker compose $COMPOSE_FILES ps -q fineract)" 2>/dev/null || true)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the full-stack journeys
        working-directory: frontend
        run: npm run e2e:full-stack

      - name: Dump container logs on failure
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color

      - name: Tear down the stack
        if: always()
        run: docker compose $COMPOSE_FILES down -v

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-stack-report-${{ matrix.fineract }}-${{ matrix.bff }}
          path: frontend/playwright-report/full-stack
          retention-days: 14

      - name: Upload traces and videos on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-stack-test-results-${{ matrix.fineract }}-${{ matrix.bff }}
          path: frontend/test-results/full-stack
          retention-days: 14
