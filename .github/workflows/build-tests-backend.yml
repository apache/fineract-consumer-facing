name: Consumer App Unit and E2E Testing

on:
  push:
    paths:
      - 'consumer/**'
      - 'docs/build.gradle'
      - '.github/workflows/build-tests-backend.yml'
  pull_request:
    paths:
      - 'consumer/**'
      - 'docs/build.gradle'
      - '.github/workflows/build-tests-backend.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: consumer

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle and Validate Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Generate dev JWT signing key
        run: ./scripts/generate-dev-jwt-key.sh

      - name: Pre-create JaCoCo mount directories
        run: mkdir -p build/jacoco-agent build/jacoco

      - name: Start application stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Verify PostgreSQL connection
        run: |
          while ! pg_isready -d consumerapp -U consumerapp -h 127.0.0.1 -p 5432 ; do
            sleep 1
          done

      - name: Capture OpenAPI spec
        run: ./gradlew --no-daemon openapi

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-spec
          path: consumer/build/openapi/openapi.json
          retention-days: 30

      - name: Generate clients
        run: ./gradlew --no-daemon generateClients

      - name: Upload TypeScript client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-angular-client
          path: frontend/src/openapi-client
          retention-days: 30

      # Error Prone runs inside every compile; this adds SpotBugs and Modernizer. It needs the
      # generated Java client above because the test source set compiles against it.
      - name: Run static analysis
        run: ./gradlew --no-daemon spotbugsMain spotbugsTest modernizer

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Run Cucumber tests
        run: ./gradlew --no-daemon cucumber

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down application stack
        if: always()
        run: docker compose down -v

      - name: Archive static analysis reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-analysis-reports
          path: consumer/build/reports/spotbugs/
          retention-days: 5

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: 'consumer/**/build/reports/'
          retention-days: 5
