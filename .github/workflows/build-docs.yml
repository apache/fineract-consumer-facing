name: Docs Build

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/build-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/build-docs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: consumer

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle and Validate Wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      - name: Install diagram tooling
        working-directory: /tmp
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          curl -fsSLo d2.tar.gz https://github.com/terrastruct/d2/releases/download/v0.8.2/d2-v0.8.2-linux-amd64.tar.gz
          tar -xzf d2.tar.gz
          sudo install d2-v0.8.2/bin/d2 /usr/local/bin/d2

      - name: Build documentation
        run: ./gradlew --no-daemon :docs:asciidoctor :docs:asciidoctorFrontend
