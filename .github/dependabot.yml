version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # init/analyze must run the same version; bump them together
      codeql:
        patterns:
          - "github/codeql-action*"

  # Maintain dependencies for npm (Angular client in frontend/)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Angular packages pin each other to exact versions; bump in lockstep
      angular:
        patterns:
          - "@angular/*"
          - "angular-eslint"

  # Maintain dependencies for Gradle (BFF in consumer/)
  - package-ecosystem: "gradle"
    directory: "/consumer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Liquibase 5 is no longer Apache-licensed; Fineract stays on 4.33.x (FINERACT-2326)
      - dependency-name: "org.liquibase:*"
        versions: [">= 5.0.0"]

  # Maintain dependencies for Docker (BFF and frontend images)
  - package-ecosystem: "docker"
    directories:
      - "/consumer"
      - "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
