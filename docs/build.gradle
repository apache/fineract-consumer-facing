// Compiles the AsciiDoc manuals in docs/consumer/ and docs/frontend/ to single HTML pages.
// see also: https://asciidoctor.github.io/asciidoctor-gradle-plugin/master/user-guide/

plugins {
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

repositories {
    mavenCentral()
}

asciidoctorj {
    attributes = [
        docdate: new Date(),
        toc: 'left',
        icons: 'font',
        'source-highlighter': 'rouge',
        sectanchors: '',
        sectlinks: '',
        diagramsdir: "${projectDir}/consumer/diagrams".toString(),
        imagesdir: 'images',
        imagesoutdir: layout.buildDirectory.dir('docs/html/images').get().asFile.absolutePath,
    ]

    modules {
        // 2.2.3 (plugin default) predates d2 support, which arrived in 2.2.4
        diagram.use()
        diagram.version '2.3.1'
    }

    fatalWarnings ~/include file not found|missing callout|image to embed not found or not readable/
    fatalWarnings missingIncludes()
}

asciidoctor {
    baseDir 'consumer'
    sourceDir 'consumer'
    sources {
        include('index.adoc')
    }
    outputDir layout.buildDirectory.dir('docs/html')

    logging.captureStandardError LogLevel.INFO
}

tasks.register('asciidoctorFrontend', org.asciidoctor.gradle.jvm.AsciidoctorTask) {
    baseDir 'frontend'
    sourceDir 'frontend'
    sources {
        include('index.adoc')
    }
    outputDir layout.buildDirectory.dir('docs/html-frontend')

    logging.captureStandardError LogLevel.INFO
}
