import org.openapitools.generator.gradle.plugin.tasks.GenerateTask
import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import com.github.jk1.license.filter.LicenseBundleNormalizer

plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.6'
	id 'org.graalvm.buildtools.native' version '0.11.5' apply false
	id 'io.spring.dependency-management' version '1.1.7'
	id 'se.thinkcode.cucumber-runner' version '0.0.14'
	id 'org.openapi.generator' version '7.14.0'
	id 'com.github.jk1.dependency-license-report' version '3.1.4'
	id 'net.ltgt.errorprone' version '4.4.0'
	id 'com.github.spotbugs' version '6.5.4'
	id 'com.github.andygoossens.modernizer' version '1.13.0'
}

group = 'org.apache.fineract'
version = '0.0.1-SNAPSHOT'

def buildDirPath = layout.buildDirectory.get().asFile.path

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

// Native image: ./gradlew -Pnative nativeCompile (needs a GraalVM 25 JDK; peak build memory ~9 GiB).
// Applied only on request because the plugin makes every bootJar and test run Spring AOT processing.
// See docs/consumer/development/native-image.adoc.
if (project.hasProperty('native')) {
	apply plugin: 'org.graalvm.buildtools.native'
	graalvmNative {
		// Most unit tests use Mockito, which cannot run in a native image. The native build is verified by
		// running the Cucumber suite against the native container instead (compose.native.yaml).
		testSupport = false
		binaries {
			main {
				imageName = 'consumer'
				buildArgs.add('-H:+ReportExceptionStackTraces')
				// Actuator's Micrometer binders (Tomcat, JVM) use the platform MBean server, whose MXBeans need
				// JMX metadata in the image. This does not open a remote JMX port.
				buildArgs.add('--enable-monitoring=jmxserver')
			}
		}
	}
}

ext {
	set('springCloudVersion', "2025.1.0")
	set('liquibase.version', "4.33.0")
}

dependencies {
	implementation platform("org.springframework.modulith:spring-modulith-bom:2.0.2")
	testImplementation platform("org.springframework.modulith:spring-modulith-bom:2.0.2")
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
	implementation 'org.springframework.modulith:spring-modulith-core'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation('org.springframework.boot:spring-boot-starter-data-jpa')
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'io.cucumber:cucumber-java:7.20.1'
	testImplementation 'io.github.openfeign:feign-okhttp'
	testImplementation 'io.github.openfeign:feign-jackson'
	testImplementation 'io.github.openfeign:feign-slf4j'
	testImplementation 'org.openapitools:jackson-databind-nullable:0.2.6'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	errorprone 'com.google.errorprone:error_prone_core:2.49.0'
	spotbugsPlugins 'jp.skypencil.findbugs.slf4j:bug-pattern:1.5.0@jar'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

licenseReport {
	configurations = ['runtimeClasspath']
	filters = [new LicenseBundleNormalizer(createDefaultTransformationRules: true)]
	allowedLicensesFile = file("$projectDir/allowed-licenses.json")
}

sourceSets {
	main {
		java {
			srcDir "$buildDirPath/generated/fineractclient/src/main/java"
		}
	}
	test {
		java {
			srcDir "$buildDirPath/generated/java-client/src/main/java"
		}
	}
}

tasks.named('compileJava') {
	dependsOn 'generateFineractClient'
}

// Static analysis, mirroring Apache Fineract core: Error Prone (compile time), SpotBugs with the
// SLF4J bug patterns, and Modernizer. Code generated into build/ (the Fineract Feign client, the
// test client, Spring AOT sources) is excluded from all three.
// See docs/consumer/development/build-and-test.adoc.
tasks.withType(JavaCompile).configureEach {
	options.errorprone {
		disableWarningsInGeneratedCode = true
		excludedPaths = '.*/build/generated/.*'
		disable(
			'CanIgnoreReturnValueSuggester',
			'SameNameButDifferent', // Until Error Prone recognizes Lombok
			'MultiVariableDeclaration', // Until Error Prone recognizes Lombok
			'StringConcatToTextBlock' // Error Prone 2.49.0 crashes on JDK 25: https://github.com/google/error-prone/issues/5815
		)
		error(
			'DefaultCharset',
			'StringSplitter',
			'MutablePublicArray',
			'EqualsGetClass',
			'FutureReturnValueIgnored'
		)
	}
}

configurations.named('spotbugs').configure {
	resolutionStrategy.eachDependency {
		if (it.requested.group == 'org.ow2.asm') {
			it.useVersion '9.8'
			it.because 'ASM 9.8 is required for JDK 25 class files'
		}
	}
}

spotbugs {
	showProgress = false
	excludeFilter = file("$projectDir/config/spotbugs/exclude.xml")
	// Without this the SpotBugs worker inherits the JVM default (25% of RAM).
	maxHeapSize = '1g'
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html {
			required = true
			stylesheet = 'fancy-hist.xsl'
		}
		xml {
			required = true
		}
	}
}

modernizer {
	includeTestClasses = true
	failOnViolations = true
	violationLogLevel = 'error'
	javaVersion = java.toolchain.languageVersion.get().asInt().toString()
	ignoreGeneratedClasses = true
	// openapi-generator's @Generated is source-retention, so name the generated client packages instead.
	ignorePackages = [
		'org.apache.fineract.consumer.infrastructure.fineractclient.generated',
		'org.apache.fineract.consumer.client'
	]
	// Rules: https://github.com/gaul/modernizer-maven-plugin/blob/master/modernizer-maven-plugin/src/main/resources/modernizer.xml
	exclusions = [
		'java/util/Optional.get:()Ljava/lang/Object;' // As in Fineract core: Optional.get() is not forced to orElseThrow()
	]
}

def jacocoExcludes = [
	'org/apache/fineract/consumer/**/data/**',
	'org/apache/fineract/consumer/**/exception/**',
	'org/apache/fineract/consumer/infrastructure/fineractclient/generated/**',
	'org/apache/fineract/consumer/ConsumerApplication*',
	'org/apache/fineract/consumer/infrastructure/configs/**Properties*'
]

configurations {
	jacocoAgentRuntime
}

dependencies {
	jacocoAgentRuntime "org.jacoco:org.jacoco.agent:${jacoco.toolVersion}:runtime"
}

task copyJacocoAgent(type: Copy) {
	description = 'Copy the standalone JaCoCo agent jar to build/jacoco-agent for bind-mounting into the bff container.'
	group = 'verification'
	from configurations.jacocoAgentRuntime
	into layout.buildDirectory.dir('jacoco-agent')
	rename { 'jacocoagent.jar' }
}

task extractContainerClasses {
	description = 'Extract BOOT-INF/classes from the running bff container into build/jacoco/container. Run while the compose stack is still up.'
	group = 'verification'
	doLast {
		def containerJar = layout.buildDirectory.file('jacoco/app.jar').get().asFile
		containerJar.parentFile.mkdirs()
		exec {
			commandLine 'docker', 'cp', 'bff:/app/app.jar', containerJar.absolutePath
		}
		copy {
			from zipTree(containerJar)
			include 'BOOT-INF/classes/**'
			into layout.buildDirectory.dir('jacoco/container')
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// Records the violations of a newly frozen ArchUnit rule once (FreezingArchRule); commit the new
	// file under src/test/resources/archunit_store. Without the flag a missing store file fails the build.
	if (project.hasProperty('archunitFreezeNewRules')) {
		systemProperty 'archunit.freeze.store.default.allowStoreCreation', 'true'
	}
	finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
	dependsOn 'test'
	reports {
		html.required = true
		xml.required = false
	}
	executionData fileTree(layout.buildDirectory.dir('jacoco')) { include 'cucumber.exec' }
	def containerClasses = layout.buildDirectory.dir('jacoco/container/BOOT-INF/classes').get().asFile
	if (containerClasses.exists()) {
		classDirectories.setFrom(fileTree(dir: containerClasses, exclude: jacocoExcludes))
	} else {
		classDirectories.setFrom(
			classDirectories.files.collect { fileTree(dir: it, exclude: jacocoExcludes) }
		)
	}
}

cucumber {
	featurePath = 'src/test/resources/features'
	glue = 'org.apache.fineract.consumer.cucumber'
	plugin = ['pretty']
}

task openapi {
	description = 'Capture OpenAPI spec from the running app at localhost:8080.'
	group = 'documentation'
	doLast {
		def out = file("$buildDirPath/openapi/openapi.json")
		out.parentFile.mkdirs()
		new URL("http://localhost:8080/v3/api-docs").withInputStream { input ->
			out.withOutputStream { it << input }
		}
		println "OpenAPI spec → ${out}"
	}
}

task generateJavaClient(type: GenerateTask) {
	description = 'Generate Java/Feign client for BFF tests.'
	group = 'documentation'
	generatorName  = 'java'
	library        = 'feign'
	inputSpec      = "$buildDirPath/openapi/openapi.json"
	outputDir      = "$buildDirPath/generated/java-client"
	ignoreFileOverride = "$projectDir/openapi/java.ignore"
	apiPackage     = 'org.apache.fineract.consumer.client.api'
	modelPackage   = 'org.apache.fineract.consumer.client.model'
	invokerPackage = 'org.apache.fineract.consumer.client'
	generateApiTests           = false
	generateModelTests         = false
	generateApiDocumentation   = false
	generateModelDocumentation = false
	configOptions = [
		dateLibrary         : 'java8',
		serializationLibrary: 'jackson',
		useTags             : 'true',
		useJakartaEe        : 'true'
	]
	dependsOn 'openapi'
}

def fineractRawSpec = file("$projectDir/src/main/java/org/apache/fineract/consumer/infrastructure/fineractclient/spec/fineract.json")
def fineractSanitizedSpec = file("$buildDirPath/fineract-spec/fineract.sanitized.json")

def stripNullOnlyEnums(node) {
	if (node instanceof Map) {
		if (node.enum instanceof List && node.enum && node.enum.every { it == null }) node.remove('enum')
		node.values().each { stripNullOnlyEnums(it) }
	} else if (node instanceof List) {
		node.each { stripNullOnlyEnums(it) }
	}
}

def retypeIntegerMoneyFields(schemas) {
	def moneyPropertyNames = ['principal', 'amount', 'depositAmount'] as Set
	schemas.each { schemaName, schema ->
		(schema.properties ?: [:]).each { propName, prop ->
			if (propName in moneyPropertyNames && prop.type == 'integer') {
				prop.type = 'number'
				prop.remove('format')
			}
		}
	}
}

def addMissingClientAccountBalanceFields(schemas) {
	def missingMoneyFields = [
		GetClientsSavingsAccounts: ['accountBalance', 'availableBalance'],
		GetClientsLoanAccounts   : ['loanBalance', 'amountPaid']
	]
	missingMoneyFields.each { schemaName, propNames ->
		def properties = schemas[schemaName]?.properties
		if (properties == null) {
			throw new GradleException("Fineract spec schema '$schemaName' missing — revisit addMissingClientAccountBalanceFields")
		}
		propNames.each { propName ->
			if (!properties.containsKey(propName)) {
				properties[propName] = [type: 'number']
			}
		}
	}
}

def addMissingClientProfileFields(schemas) {
	def missingFields = [
		mobileNo    : [type: 'string'],
		imagePresent: [type: 'boolean']
	]
	def properties = schemas.GetClientsClientIdResponse?.properties
	if (properties == null) {
		throw new GradleException("Fineract spec schema 'GetClientsClientIdResponse' missing — revisit addMissingClientProfileFields")
	}
	missingFields.each { propName, propDef ->
		if (!properties.containsKey(propName)) {
			properties[propName] = propDef
		}
	}
}

def fixObligeeDetailsResponseShape(paths) {
	def obligeeOperationPaths = [
		'/v1/clients/{clientId}/obligeedetails',
		'/v1/clients/external-id/{externalId}/obligeedetails'
	]
	obligeeOperationPaths.each { pathName ->
		def schema = paths[pathName]?.get?.responses?.'200'?.content?.'application/json'?.schema
		if (schema == null) {
			throw new GradleException("Fineract spec path '$pathName' missing 200 response schema — revisit fixObligeeDetailsResponseShape")
		}
		schema.remove('$ref')
		schema.type = 'array'
		schema.items = ['$ref': '#/components/schemas/GetObligeeData']
	}
}

def fixClientImageResponseShape(paths) {
	def operation = paths['/v1/{entityType}/{entityId}/images']?.get
	if (operation?.responses == null) {
		throw new GradleException("Fineract spec path '/v1/{entityType}/{entityId}/images' GET missing — revisit fixClientImageResponseShape")
	}
	operation.responses = ['200': [
		description: 'base64 data-URI of the stored image',
		content    : ['text/plain': [schema: [type: 'string']]]
	]]
}

def addMissingSavingsAccountCommandFields(schemas) {
	def missingAccountFields = [
		withdrawnOnDate: [type: 'string'],
		note           : [type: 'string']
	]
	def properties = schemas.PostSavingsAccountsAccountIdRequest?.properties
	if (properties == null) {
		throw new GradleException("Fineract spec schema 'PostSavingsAccountsAccountIdRequest' missing — revisit addMissingSavingsAccountCommandFields")
	}
	missingAccountFields.each { propName, propDef ->
		if (!properties.containsKey(propName)) {
			properties[propName] = propDef
		}
	}

	def missingPutFields = [
		productId      : [type: 'integer', format: 'int64'],
		submittedOnDate: [type: 'string'],
		dateFormat     : [type: 'string']
	]
	def putProps = schemas.PutSavingsAccountsAccountIdRequest?.properties
	if (putProps == null) {
		throw new GradleException("Fineract spec schema 'PutSavingsAccountsAccountIdRequest' missing — revisit addMissingSavingsAccountCommandFields")
	}
	missingPutFields.each { propName, propDef ->
		if (!putProps.containsKey(propName)) {
			putProps[propName] = propDef
		}
	}
}

// Fineract code generation is scoped to the APIs the BFF and the Cucumber seeder call. Generating the
// whole spec (~150 tags) put ~1,500 models and ~140 unused Feign clients in the jar, each one a bean
// with its own child context at startup. Add a tag here before using a new generated *Api.
def fineractApiTags = [
	'Account Transfers', 'Client', 'Client Charges', 'Client Identifier', 'Guarantors',
	'Loan Charges', 'Loan Products', 'Loan Transactions', 'Loans',
	'Savings Account', 'Savings Account Transactions', 'Savings Charges', 'Savings Product', 'Search API',
	// Cucumber seeder only
	'Code Values', 'Codes', 'Currency'
] as Set
// Untagged operations are generated into DefaultApi; keep only the ones called.
def fineractUntaggedOperationIds = ['retrieveImage'] as Set

def pruneToUsedFineractApis(spec, Set tags, Set untaggedOperationIds) {
	def httpMethods = ['get', 'put', 'post', 'delete', 'patch', 'head', 'options', 'trace'] as Set
	def foundTags = [] as Set
	def foundUntagged = [] as Set
	spec.paths.each { path, item ->
		item.keySet().findAll { it in httpMethods }.toList().each { method ->
			def op = item[method]
			def opTags = op.tags ?: []
			boolean keep = opTags ? opTags.any { it in tags } : (op.operationId in untaggedOperationIds)
			if (!keep) {
				item.remove(method)
			} else if (opTags) {
				foundTags.addAll(opTags.findAll { it in tags })
			} else {
				foundUntagged << op.operationId
			}
		}
	}
	def missing = (tags - foundTags) + (untaggedOperationIds - foundUntagged)
	if (missing) {
		throw new GradleException("Fineract spec no longer has $missing — revisit fineractApiTags / fineractUntaggedOperationIds")
	}
	spec.paths.keySet().removeAll { !spec.paths[it].keySet().any { m -> m in httpMethods } }

	// Keep only the components reachable from the remaining operations.
	def reachable = [] as Set
	def pending = new ArrayDeque<Object>()
	pending.add(spec.paths)
	while (!pending.isEmpty()) {
		def node = pending.poll()
		if (node instanceof Map) {
			def ref = node['$ref']
			if (ref instanceof String && ref.startsWith('#/components/')) {
				def key = ref.substring('#/components/'.length())
				if (reachable.add(key)) {
					def parts = key.split('/', 2)
					def target = spec.components[parts[0]]?.get(parts[1])
					if (target != null) {
						pending.add(target)
					}
				}
			}
			node.values().findAll { it != null }.each { pending.add(it) }
		} else if (node instanceof List) {
			node.findAll { it != null }.each { pending.add(it) }
		}
	}
	spec.components.each { type, entries ->
		if (type != 'securitySchemes' && entries instanceof Map) {
			entries.keySet().retainAll { "$type/$it".toString() in reachable }
		}
	}
	spec.tags?.removeAll { !(it.name in tags) }
}

task sanitizeFineractSpec {
	description = 'Patch known defects in the vendored Fineract spec and prune it to the APIs in use before code generation.'
	group = 'documentation'
	inputs.file fineractRawSpec
	inputs.property "fineractApiTags", fineractApiTags.sort()
	inputs.property "fineractUntaggedOperationIds", fineractUntaggedOperationIds.sort()
	outputs.file fineractSanitizedSpec
	doLast {
		def spec = new JsonSlurper().parse(fineractRawSpec)
		stripNullOnlyEnums(spec)
		retypeIntegerMoneyFields(spec.components.schemas)
		addMissingClientAccountBalanceFields(spec.components.schemas)
		addMissingClientProfileFields(spec.components.schemas)
		addMissingSavingsAccountCommandFields(spec.components.schemas)
		fixObligeeDetailsResponseShape(spec.paths)
		fixClientImageResponseShape(spec.paths)
		pruneToUsedFineractApis(spec, fineractApiTags, fineractUntaggedOperationIds)
		fineractSanitizedSpec.parentFile.mkdirs()
		fineractSanitizedSpec.text = JsonOutput.toJson(spec)
	}
}

task generateFineractClient(type: GenerateTask) {
	description = 'Generate Spring Cloud Feign client for the Fineract Core APIs listed in fineractApiTags.'
	group = 'documentation'
	generatorName  = 'spring'
	library        = 'spring-cloud'
	skipValidateSpec = true
	inputSpec      = fineractSanitizedSpec.path
	outputDir      = "$buildDirPath/generated/fineractclient"
	ignoreFileOverride = "$projectDir/src/main/java/org/apache/fineract/consumer/infrastructure/fineractclient/spec/fineract.ignore"
	apiPackage     = 'org.apache.fineract.consumer.infrastructure.fineractclient.generated.api'
	modelPackage   = 'org.apache.fineract.consumer.infrastructure.fineractclient.generated.model'
	invokerPackage = 'org.apache.fineract.consumer.infrastructure.fineractclient.generated'
	templateDir    = "$projectDir/src/main/java/org/apache/fineract/consumer/infrastructure/fineractclient/templates"
	generateApiTests           = false
	generateModelTests         = false
	generateApiDocumentation   = false
	generateModelDocumentation = false
	typeMappings = [
		float : 'BigDecimal',
		double: 'BigDecimal'
	]
	configOptions = [
		useJakartaEe         : 'true',
		useTags              : 'true',
		interfaceOnly        : 'false',
		useResponseEntity    : 'false',
		dateLibrary          : 'java8',
		documentationProvider: 'none',
		annotationLibrary    : 'none',
		useBeanValidation    : 'false',
		openApiNullable      : 'false'
	]
	dependsOn 'sanitizeFineractSpec'
}

task generateTypescriptClient(type: GenerateTask) {
	description = 'Generate TypeScript/Angular client for the frontend.'
	group = 'documentation'
	generatorName = 'typescript-angular'
	inputSpec     = "$buildDirPath/openapi/openapi.json"
	outputDir     = "$projectDir/../frontend/src/openapi-client"
	ignoreFileOverride = "$projectDir/openapi/typescript.ignore"
	configOptions = [
		npmName            : '@bff/client',
		npmVersion         : project.version.toString(),
		ngVersion          : '20.0.0',
		supportsES6        : 'true',
		withInterfaces     : 'true',
		providedInRoot     : 'true',
		modelPropertyNaming: 'camelCase'
	]
	dependsOn 'openapi'
}

task generateClients {
	description = 'Generate Java + TypeScript clients from the OpenAPI spec.'
	group = 'documentation'
	dependsOn 'generateJavaClient', 'generateTypescriptClient'
}
