spring.application.name=consumer

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/consumerapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:consumerapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=validate

# Spring Modulith — module detection + named-interface convention (replaces per-package @NamedInterface files)
spring.modulith.detection-strategy=org.apache.fineract.consumer.ConsumerModuleDetectionStrategy

spring.modulith.events.jdbc.schema-initialization.enabled=false
# Outbox housekeeping: drop event_publication rows on listener success instead of keeping completed rows forever
spring.modulith.events.completion-mode=delete

# Honor X-Forwarded-* headers from upstream reverse proxies (nginx in docker-compose.e2e.yml) for HTTPS.
server.forward-headers-strategy=framework

# Fineract service account variables
fineract.client.base-url=${FINERACT_BASE_URL:http://localhost:8888/fineract-provider/api}
fineract.client.username=${FINERACT_SERVICE_USERNAME:mifos}
fineract.client.password=${FINERACT_SERVICE_PASSWORD:password}
fineract.client.tenant-id=${FINERACT_SERVICE_TENANT:default}

# JWT signing — ES256 keypair PEM (PKCS#8 private key + public key in one file), read once at startup.
# Dev: generated by scripts/generate-dev-jwt-key.sh (gitignored). Prod: mounted from a secret manager.
jwt.key-location=${JWT_KEY_LOCATION:file:dev-jwt-key.pem}
jwt.issuer=${JWT_ISSUER:http://localhost:8080}

# Authentication session tuning — Durations accept Spring's shorthand (15m, 1d).
# cookie-secure stays false in dev (plain-HTTP compose stack); set true wherever TLS terminates in front.
authentication.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:15m}
authentication.challenge-token-ttl=${AUTH_CHALLENGE_TOKEN_TTL:5m}
authentication.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:1d}
# rotation-grace-ttl: window after a refresh-token rotation during which presenting the
# just-replaced token is treated as an honest race (concurrent tabs), not theft.
authentication.rotation-grace-ttl=${AUTH_ROTATION_GRACE_TTL:30s}
authentication.cookie-secure=${AUTH_COOKIE_SECURE:false}

# JWT denylist store — Valkey (Redis wire-compatible, hence the spring.data.redis.* namespace)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# OTP email delivery — Mailpit in docker-compose; institution SMTP in prod
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
otp.email.from=${OTP_EMAIL_FROM:no-reply@fineract-consumer.local}
otp.email.subject=${OTP_EMAIL_SUBJECT:Your verification code}

# Audit table configurations
consumer.audit.retention-days.server=365
consumer.audit.retention-days.client=30
consumer.audit.purge-cron=0 30 3 * * *
consumer.audit.purge-batch-size=1000
consumer.audit.purge-enabled=false
consumer.audit.max-batch-size=50
consumer.audit.max-details-bytes=2048

# Per-user rate limiting (WS-I). Per-IP volumetrics are handled by an upstream edge service, not in this repo.
# The tpp-client bucket covers the OAuth2 token endpoint, keyed on the presented TPP client id.
consumer.rate-limit.enabled=true
consumer.rate-limit.per-user-per-minute=300
consumer.rate-limit.per-tpp-client-per-minute=60

# Open banking (in-process Spring Authorization Server) — demo TPP client + token/consent TTLs.
# redirect-uri is a dead localhost address: Cucumber asserts redirects without following them.
# tpp-client.secret has no default on purpose: fail closed at startup rather than run with a known value.
consumer.oauth2.tpp-client.id=${OB_TPP_CLIENT_ID:demo-tpp}
consumer.oauth2.tpp-client.secret=${OB_TPP_CLIENT_SECRET}
consumer.oauth2.tpp-client.redirect-uri=${OB_TPP_CLIENT_REDIRECT_URI:http://localhost:9999/tpp/callback}
consumer.oauth2.access-token-ttl=${OB_ACCESS_TOKEN_TTL:5m}
consumer.oauth2.refresh-token-ttl=${OB_REFRESH_TOKEN_TTL:90d}
consumer.oauth2.consent-ttl=${OB_CONSENT_TTL:90d}
consumer.oauth2.frontend-base-url=${OB_FRONTEND_BASE_URL:http://localhost:4443}
consumer.oauth2.kid=${OB_JWT_KID:bff-es256}
