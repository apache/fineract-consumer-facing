databaseChangeLog:
  - logicalFilePath: db/changelog/audit/004-create-audit-events.yaml
  - changeSet:
      id: 004-create-audit-events
      author: fineract-consumer-facing
      changes:
        - createTable:
            tableName: audit_events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_uuid
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: source
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: severity
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_audit_events_user_id
                    references: users(id)
              - column:
                  name: unknown_principal
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: device_fingerprint
                  type: VARCHAR(100)
              - column:
                  name: correlation_id
                  type: VARCHAR(64)
              - column:
                  name: idempotency_key
                  type: VARCHAR(64)
              - column:
                  name: occurred_at_claimed
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: received_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: JSONB
        - createIndex:
            tableName: audit_events
            indexName: idx_audit_events_user_id_received_at
            columns:
              - column:
                  name: user_id
              - column:
                  name: received_at
        - createIndex:
            tableName: audit_events
            indexName: idx_audit_events_event_type_received_at
            columns:
              - column:
                  name: event_type
              - column:
                  name: received_at
        - createIndex:
            tableName: audit_events
            indexName: idx_audit_events_received_at
            columns:
              - column:
                  name: received_at
      rollback:
        - dropTable:
            tableName: audit_events
