databaseChangeLog:
  - logicalFilePath: db/changelog/infrastructure/008-create-registered-tpps.yaml
  - changeSet:
      id: 008-create-registered-tpps
      author: fineract-consumer-facing
      changes:
        - sql:
            sql: "CREATE TYPE registered_tpp_status AS ENUM ('ACTIVE', 'REVOKED')"
        - createTable:
            tableName: registered_tpps
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: client_secret_hash
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: client_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: redirect_uri
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: scopes
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: registered_tpp_status
                  constraints:
                    nullable: false
              - column:
                  name: onboarded_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: status_updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: registered_tpps
        - sql:
            sql: "DROP TYPE registered_tpp_status"
