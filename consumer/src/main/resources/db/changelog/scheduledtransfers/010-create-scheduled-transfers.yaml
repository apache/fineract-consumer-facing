databaseChangeLog:
  - logicalFilePath: db/changelog/scheduledtransfers/010-create-scheduled-transfers.yaml
  - changeSet:
      id: 010-create-scheduled-transfers
      author: fineract-consumer-facing
      changes:
        - createTable:
            tableName: scheduled_transfers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: public_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_scheduled_transfers_user_id
                    references: users(id)
              - column:
                  name: idempotency_key
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_scheduled_transfers_idempotency_key
              - column:
                  name: fineract_from_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: fineract_to_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: fineract_standing_instruction_id
                  type: BIGINT
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_scheduled_transfers_fineract_instruction
              - column:
                  name: claimed_until
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: scheduled_transfers
            indexName: idx_scheduled_transfers_user_to_account
            columns:
              - column:
                  name: user_id
              - column:
                  name: fineract_to_account_id
      rollback:
        - dropTable:
            tableName: scheduled_transfers
