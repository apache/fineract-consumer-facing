databaseChangeLog:
  - logicalFilePath: db/changelog/openbanking/006-create-open-banking-consents.yaml
  - changeSet:
      id: 006-create-open-banking-consents
      author: fineract-consumer-facing
      changes:
        - sql:
            sql: "CREATE TYPE open_banking_consent_status AS ENUM ('AWAITING_AUTHORISATION', 'AUTHORISED', 'REJECTED', 'REVOKED')"
        - createTable:
            tableName: open_banking_consents
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tpp_client_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
              - column:
                  name: permissions
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: open_banking_consent_status
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: status_updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: open_banking_consents
            indexName: idx_open_banking_consents_user_id
            columns:
              - column:
                  name: user_id
      rollback:
        - dropTable:
            tableName: open_banking_consents
        - sql:
            sql: "DROP TYPE open_banking_consent_status"
